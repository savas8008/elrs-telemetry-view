plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elrstelemetri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elrstelemetri'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
}
