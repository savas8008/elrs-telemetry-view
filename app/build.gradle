plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elrstelemetri'
    compileSdk 35

    defaultConfig {
        applicationId 'com.elrstelemetri'
        minSdk 29
        targetSdk 35
        versionCode 23
        versionName '1.7'
        // native UVC libraries (USB capture devices): phones only, keeps the APK small
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Release signing: the keystore comes from the CI secrets (never from the repository). Every
    // release must be signed with the same key, otherwise Android refuses to install it as an update.
    def ks = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'elrs'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'screenshots', (project.findProperty('screenshots') ?: 'false')
                testLogging { events 'passed', 'skipped', 'failed', 'standardOut' }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // UVC video from USB capture devices (AV to USB). Apache 2.0, prebuilt libuvc/libusb
    implementation 'com.herohan:UVCAndroid:1.0.13'
    // its AndroidX libraries mix Kotlin stdlib 1.8 with the old 1.6 jdk7/jdk8 split: align them
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
