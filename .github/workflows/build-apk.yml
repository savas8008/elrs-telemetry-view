name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install ffmpeg (goggles video pipeline tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee gradle.log
      - name: Test summary (annotation)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r = ET.parse(f).getroot()
              print('::notice title=tests::%s tests=%s failures=%s errors=%s skipped=%s' % (
                  r.get('name').split('.')[-1], r.get('tests'), r.get('failures'), r.get('errors'), r.get('skipped')))
          PY
      - name: Error summary (annotation)
        if: failure()
        run: |
          L=$(grep -n -m1 -E "FAILED|What went wrong" gradle.log | cut -d: -f1)
          sed -n "$(( ${L:-1} > 15 ? ${L:-1} - 15 : 1 )),+90p" gradle.log > err.txt
          python3 - <<'PY'
          lines = open('err.txt', encoding='utf-8', errors='replace').read().splitlines()
          chunks = ['\n'.join(lines[i:i+12]) for i in range(0, len(lines), 12)][:9]
          for c in chunks:
              print('::error title=gradle::' + c.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
      - name: Screenshots (Robolectric)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests '*GcsScreenshotTest*' -Pscreenshots=true 2>&1 | tee shot.log || {
            python3 -c "
          import re
          L=[l for l in open('shot.log',errors='replace').read().splitlines() if re.search(r'FAILED|Exception|Caused by|at com\.elrstelemetri|at org\.osmdroid|error', l)][:40]
          for i in range(0,len(L),10): print('::warning title=screenshot::'+'%0A'.join(x.replace('%','%25') for x in L[i:i+10]))
          "; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ELRS-Telemetry-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ELRS-Telemetry-apk
          path: ELRS-Telemetry-${{ github.run_number }}.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "ELRS-Telemetry-${{ github.run_number }}.apk" \
            $( [ -f app/build/screenshots/gcs.png ] && echo "app/build/screenshots/gcs.png#screenshot-gcs.png" ) \
            $( [ -f app/build/screenshots/settings.png ] && echo "app/build/screenshots/settings.png#screenshot-settings.png" ) \
            $( [ -f app/build/screenshots/gcs-full.png ] && echo "app/build/screenshots/gcs-full.png#screenshot-video-full.png" ) \
            $( [ -f app/build/screenshots/waiting.png ] && echo "app/build/screenshots/waiting.png#screenshot-waiting.png" ) \
            --title "ELRS Telemetry - build ${{ github.run_number }}" \
            --notes "Automatic build (${{ github.sha }}). Download the APK and install it on your phone or tablet." \
            --latest
